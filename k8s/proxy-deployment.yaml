apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: lomax
  labels:
    app: proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      containers:
        - name: proxy
          image: lomax-proxy:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
