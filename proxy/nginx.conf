server {
    listen 80;

    # nginx por defecto limita el body a 1m; el limite real de 5Mb lo aplica
    # multer en el backend, asi que aqui se deja margen (6m) para que nginx no
    # rechace antes de que el backend pueda devolver su propio 413 a proposito.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://backend:4000/;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:80/;
        proxy_set_header Host $host;
    }
}
